[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rul"
version = "0.1.0"
description = "Remaining useful life prediction on NASA C-MAPSS, team T081"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.0",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "shap==0.54.1",
    "jupyter==1.1.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2", "nbconvert==7.17.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
