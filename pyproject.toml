[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rul"
version = "0.1.0"
description = "Remaining useful life prediction on NASA C-MAPSS, team T081"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "matplotlib",
    "seaborn",
    "shap",
    "jupyter",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "nbconvert"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
